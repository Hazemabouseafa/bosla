services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bosla
      POSTGRES_PASSWORD: bosla_dev_password
      POSTGRES_DB: bosla_academy
    ports:
      - "5432:5432"
    volumes:
      - bosla_dev_pg:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - bosla_dev_redis:/data

volumes:
  bosla_dev_pg:
  bosla_dev_redis:
