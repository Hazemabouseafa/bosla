worker_processes auto;

events {
  worker_connections 2048;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  server_tokens off;

  # Security headers
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  # Gzip for web & HLS playlists
  gzip on;
  gzip_types text/plain text/css application/json application/javascript application/vnd.apple.mpegurl;

  upstream web_upstream {
    server web:3000;
  }

  upstream api_upstream {
    server api:4000;
  }

  server {
    listen 80;
    server_name _;

    # Support large chunked uploads (up to 100MB per chunk; full video is multi-chunk)
    client_max_body_size 100M;
    client_body_timeout 120s;

    # Internal-only protected HLS media volume (NEVER directly accessible by clients)
    location /_internal_hls/ {
      internal;
      alias /var/bosla/media/hls/;
      types {
        application/vnd.apple.mpegurl m3u8;
        video/mp2t ts;
      }
      add_header Cache-Control "private, no-store";
      add_header X-Content-Type-Options "nosniff" always;
    }

    # Internal-only protected lesson attachments
    location /_internal_attachments/ {
      internal;
      alias /var/bosla/media/attachments/;
      add_header Cache-Control "private, no-store";
      add_header X-Content-Type-Options "nosniff" always;
    }

    # Internal-only thumbnails (also served through API authorization)
    location /_internal_thumbnails/ {
      internal;
      alias /var/bosla/media/thumbnails/;
      add_header Cache-Control "private, max-age=300";
    }

    # API & Authorized Video Streaming / X-Accel-Redirect gateway
    location /api/ {
      proxy_pass http://api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_request_buffering off;
      proxy_buffering off;
      proxy_read_timeout 300s;
    }

    # Swagger API Docs
    location /api-docs {
      proxy_pass http://api_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Next.js Frontend
    location / {
      proxy_pass http://web_upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
